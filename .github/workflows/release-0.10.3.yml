name: Publish Another Surface 0.10.3
on:
  push:
    branches: [codex/release-0.10.3]
    paths: [.github/workflows/release-0.10.3.yml]
permissions:
  contents: read
concurrency:
  group: another-surface-release-0.10.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.10.3
      RELEASE_COMMIT: ea57a7fc5be20ca2741e5b57e4a3a4d618655cbb
      ZIP_NAME: AnotherSurface-0.10.3-win-x64.zip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ea57a7fc5be20ca2741e5b57e4a3a4d618655cbb
          persist-credentials: false
      - name: Verify and package committed distribution
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          package = Path("artifacts/AnotherSurface-0.10.3")
          manifest = json.loads((package / "BuildInfo.json").read_text(encoding="utf-8-sig"))
          assert manifest["Version"] == "0.10.3"
          expected = {r["Path"].replace("\\", "/"): r["SHA256"] for r in manifest["Files"]}
          files = {p.relative_to(package).as_posix(): p for p in package.rglob("*") if p.is_file()}
          assert set(files) == set(expected) | {"BuildInfo.json"}, "Unexpected distribution files"
          for name, digest in expected.items():
              assert hashlib.sha256(files[name].read_bytes()).hexdigest().upper() == digest, name
          archive = Path(os.environ["ZIP_NAME"])
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name, path in sorted(files.items()):
                  info = zipfile.ZipInfo("AnotherSurface-0.10.3/" + name, (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, path.read_bytes(), compresslevel=9)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for name, path in files.items():
                  assert z.read("AnotherSurface-0.10.3/" + name) == path.read_bytes(), name
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path("SHA256SUMS.txt").write_text(digest + "  " + archive.name + "\n", encoding="utf-8")
          print(f"Verified {len(files)} packaged files; ZIP SHA-256: {digest}")
          PY
      - name: Upload, verify, and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## 변경 사항
          - 앱·프로젝트·실행 파일 명칭을 Another Surface로 변경
          - README를 기능·조작·빌드 표 중심으로 정리
          - 기존 설정·라이브러리와 Windows 자동 실행 등록 호환 처리

          ## 실행
          1. AnotherSurface-0.10.3-win-x64.zip을 내려받아 압축을 풉니다.
          2. 폴더 전체를 유지한 상태로 AnotherSurface.App.exe를 실행합니다.

          Windows 10 1809 이상 또는 Windows 11, x64 및 .NET 8 Desktop Runtime이 필요합니다.

          빌드와 테스트 317개 통과. 배포 파일 해시와 ZIP 무결성을 확인했습니다.
          NOTES
          gh release create "$RELEASE_TAG" "$ZIP_NAME" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "Another Surface 0.10.3" --notes-file release-notes.md --draft
          mkdir release-verification
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-verification
          (cd release-verification && sha256sum --check SHA256SUMS.txt)
          cmp "$ZIP_NAME" "release-verification/$ZIP_NAME"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
